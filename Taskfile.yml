version: '3'

vars:
  APP_NAME: 'TorrentClick'
  APP_ID: 'com.torrentclick.app'
  BINARY_DIR: 'bin'
  BINARY_NAME: 'torrentclick'
  FYNE_BIN: '{{.HOME}}/go/bin/fyne'
  LSREGISTER: '/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister'

tasks:
  default:
    desc: 'List available tasks'
    cmds:
      - '{{.TASK}} --list'

  icon:
    desc: 'Generate application icon and system tray icon'
    sources:
      - 'scripts/gen_icon.go'
    generates:
      - 'assets/icon.png'
      - 'assets/tray_icon.png'
    cmds:
      - go run scripts/gen_icon.go

  build:
    desc: 'Compile Go binary into bin/torrentclick'
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BINARY_DIR}}/{{.BINARY_NAME}}'
    cmds:
      - mkdir -p {{.BINARY_DIR}}
      - go build -v -o {{.BINARY_DIR}}/{{.BINARY_NAME}} ./cmd/torrentclick

  test:
    desc: 'Run all unit tests'
    cmds:
      - go test -v ./...

  extension:
    desc: 'Compile Safari Web Extension bundle with xcodebuild'
    cmds:
      - xcodebuild -project safari-extension-project/TorrentClickExtension/TorrentClickExtension.xcodeproj -scheme TorrentClickExtension build SYMROOT=$(pwd)/build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  package:
    desc: 'Build and package macOS TorrentClick.app bundle with Safari extension and URL schemes'
    deps:
      - icon
      - build
      - extension
    cmds:
      - rm -rf {{.APP_NAME}}.app
      - '{{.FYNE_BIN}} package -os darwin -name {{.APP_NAME}} -app-id {{.APP_ID}} -icon $(pwd)/assets/icon.png -executable {{.BINARY_DIR}}/{{.BINARY_NAME}}'
      - |
        PLIST="{{.APP_NAME}}.app/Contents/Info.plist"
        # 1. Register magnet:, torrent:, and torrentclick: URL schemes
        plutil -replace CFBundleURLTypes -xml '<array><dict><key>CFBundleURLName</key><string>{{.APP_ID}}.schemes</string><key>CFBundleURLSchemes</key><array><string>magnet</string><string>torrent</string><string>torrentclick</string></array></dict></array>' "$PLIST"
        # 2. Register .torrent file association (CFBundleDocumentTypes)
        plutil -replace CFBundleDocumentTypes -xml '<array><dict><key>CFBundleTypeName</key><string>BitTorrent Document</string><key>CFBundleTypeRole</key><string>Viewer</string><key>LSHandlerRank</key><string>Owner</string><key>LSItemContentTypes</key><array><string>org.bittorrent.torrent</string></array><key>CFBundleTypeExtensions</key><array><string>torrent</string></array></dict></array>' "$PLIST"
        # 3. Declare uniform type identifier for .torrent files
        plutil -replace UTImportedTypeDeclarations -xml '<array><dict><key>UTTypeIdentifier</key><string>org.bittorrent.torrent</string><key>UTTypeDescription</key><string>BitTorrent Document</string><key>UTTypeConformsTo</key><array><string>public.data</string><string>public.item</string></array><key>UTTypeTagSpecification</key><dict><key>public.filename-extension</key><array><string>torrent</string></array><key>public.mime-type</key><string>application/x-bittorrent</string></dict></dict></array>' "$PLIST"
      - mkdir -p {{.APP_NAME}}.app/Contents/PlugIns
      - cp -R "build/Debug/TorrentClickExtension.app/Contents/PlugIns/TorrentClickExtension Extension.appex" "{{.APP_NAME}}.app/Contents/PlugIns/TorrentClickExtension.appex"
      - codesign -s - --force --deep "{{.APP_NAME}}.app/Contents/PlugIns/TorrentClickExtension.appex"
      - codesign -s - --force --deep "{{.APP_NAME}}.app"
      - '{{.LSREGISTER}} -f -R {{.APP_NAME}}.app'
      - 'echo "Successfully created and registered {{.APP_NAME}}.app with embedded Safari extension!"'

  register:
    desc: 'Force re-register TorrentClick.app with macOS LaunchServices'
    cmds:
      - '{{.LSREGISTER}} -f {{.APP_NAME}}.app'
      - 'echo "Registered {{.APP_NAME}}.app with LaunchServices"'

  run:
    desc: 'Run the application directly with go run'
    cmds:
      - go run ./cmd/torrentclick

  open:
    desc: 'Launch the packaged macOS app bundle'
    cmds:
      - open {{.APP_NAME}}.app

  test-magnet:
    desc: 'Send a test magnet: URL through macOS LaunchServices to verify handler'
    cmds:
      - 'open "magnet:?xt=urn:btih:c12fe1c06bba254a9dc9f519b335380dc1f74c26&dn=Ubuntu+24.04+LTS+Desktop&tr=http%3A%2F%2Ftorrent.ubuntu.com%3A6969%2Fannounce"'

  test-torrentclick:
    desc: 'Send a test torrentclick: base64 payload through macOS LaunchServices'
    cmds:
      - |
        B64="ZDg6YW5ub3VuY2UyNzpodHRwOi8vdHJhY2tlci5leGFtcGxlLmNvbS80OmluZm9kNjpsZW5ndGhpMTA0ODU3NmU0Om5hbWUxMjp0ZXN0ZmlsZS5pc28xMjpwaWVjZSBsZW5ndGhpMTYzODRlNjpwaWVjZXMyMDoxMjM0NTY3ODkwMTIzNDU2Nzg5MGVl"
        open "torrentclick://add?name=LaunchTest.torrent&data=$B64"
        echo "Sent test torrentclick:// URL via macOS LaunchServices!"

  test-torrent:
    desc: 'Create a test .torrent file and open it with macOS LaunchServices'
    cmds:
      - |
        mkdir -p /tmp/torrentclick_test
        printf 'd8:announce27:http://tracker.example.com/4:infod6:lengthi1048576e4:name14:LaunchTest.iso12:piece lengthi16384e6:pieces20:12345678901234567890ee' > /tmp/torrentclick_test/sample.torrent
        open -a {{.APP_NAME}}.app /tmp/torrentclick_test/sample.torrent
        echo "Opened test .torrent file via macOS LaunchServices!"

  clean:
    desc: 'Remove built binaries and application bundle'
    cmds:
      - rm -rf {{.BINARY_DIR}} {{.APP_NAME}}.app
